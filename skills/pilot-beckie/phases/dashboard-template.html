/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{text-size-adjust:100%;-webkit-text-size-adjust:100%}
body{font:600 var(--t-16)/1.4 var(--face);letter-spacing:.15px;color:var(--tx);background:var(--bg);margin:0;overflow-wrap:anywhere;font-synthesis-weight:none;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
::selection{background-color:rgba(73,147,221,.2)}
:focus-visible{outline-offset:3px;outline:2px solid var(--hero)}
button{all:unset;box-sizing:border-box;cursor:pointer;font:inherit;letter-spacing:inherit}
h1,h2,h3,h4,p{margin:0}
code,.code{letter-spacing:0;font-weight:500;font-family:var(--face-code)}
.ico{display:inline-block;flex:none;vertical-align:middle;inline-size:var(--u16);block-size:var(--u16)}
.tnum{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---------- page frame ---------- */
.page{display:flex;flex-direction:column;row-gap:var(--u24);max-inline-size:1440px;margin-inline:auto;padding-block:var(--u28) var(--u40);padding-inline:var(--u32)}
.page>*{min-inline-size:0}
.netwarn{max-inline-size:1440px;margin-inline:auto;padding-block-start:var(--u16);padding-inline:var(--u32)}
.netwarn>div{font:600 var(--t-16)/1.45 var(--face);color:var(--ask-tx);background:var(--ask-soft);padding-block:var(--u14);padding-inline:var(--u18);border-radius:var(--rad-row)}

/* ---------- masthead ---------- */
.masthead{align-items:center;column-gap:var(--u16);row-gap:var(--u20);display:grid;grid-template:"mark ctl" auto "ttl ttl" auto / 1fr auto}
.masthead>.brandmark{grid-area:mark}
.masthead>.controls{grid-area:ctl}
.mast-title{grid-area:ttl;min-inline-size:0}
.mast-title h1{color:var(--tx);font:700 var(--t-36)/42px var(--face-head);letter-spacing:-.56px;overflow-wrap:anywhere;text-wrap:balance}
.facts{margin-block-start:var(--u14);gap:var(--u8);align-items:center;flex-wrap:wrap;display:flex}
.lbl{color:var(--mut);font-weight:600;font-size:var(--t-14);background:var(--inset);border-radius:var(--rad-seg);padding-inline:var(--u12);block-size:var(--u32);align-items:center;display:inline-flex}
.since{color:var(--mut);font-size:var(--t-14)}
.controls{justify-content:flex-end;align-items:center;flex-wrap:wrap;gap:var(--u8);display:flex}
.iconbtn{transition:transform .15s;justify-content:center;align-items:center;display:inline-flex;color:var(--num);background:var(--inset);border-radius:var(--rad-row);inline-size:56px;block-size:56px}
.iconbtn .ico{inline-size:var(--u20);block-size:var(--u20)}
.iconbtn:active{transform:scale(.96)}
.iconbtn.turning .ico{animation:turn .8s linear infinite}
@keyframes turn{100%{transform:rotate(1turn)}}
.toggle{background:var(--inset);border-radius:var(--rad-row);padding:var(--u4);display:inline-flex}
.toggle .ico{color:var(--quiet);inline-size:var(--u20);block-size:var(--u20)}
.toggle>button[aria-pressed=true] .ico{color:var(--num)}
.toggle>button{transition:color .2s,background-color .2s,box-shadow .2s;color:var(--mut);font-weight:600;font-size:var(--t-16);border-radius:var(--rad-seg);padding-inline:var(--u16);min-inline-size:56px;block-size:48px;justify-content:center;align-items:center;display:inline-flex}
.toggle>button:hover{color:var(--tx)}
.toggle>button[aria-pressed=true],.filters>button[aria-pressed=true]{color:var(--tx);box-shadow:var(--sh);background:var(--card)}

/* ---------- brand lockup ---------- */
.brandmark{color:var(--brand);column-gap:var(--u8);align-items:center;display:inline-flex}
.brandmark>img{display:block;inline-size:auto;block-size:44px}
.eagle-d{display:none!important}
.wordmark{transform:translateY(3px);flex-direction:column;display:inline-flex}
.wm-top{white-space:nowrap;letter-spacing:-.4px;font:italic 700 var(--t-24)/1 var(--face-head)}
.wm-top>b{font-weight:700;color:var(--brand)}
.wm-top>span{color:#006DFE}
.wm-sub{letter-spacing:0;text-transform:uppercase;font:600 9px/1 var(--face);margin-block-start:var(--u5);min-inline-size:100%;inline-size:0;justify-content:space-between;display:flex}

/* ---------- state card ---------- */
.statecard{--tone:var(--hero-run);color:var(--on-hero);background:var(--tone);box-shadow:var(--sh);border-radius:var(--rad-card);padding:var(--u28) var(--u28) var(--u26);row-gap:var(--u28);flex-direction:column;display:flex;transition:background-color .4s var(--ease-out)}
.st-wait{--tone:var(--hero-wait)}
.st-done{--tone:var(--hero-done)}
.st-fail{--tone:var(--hero-fail)}
.sc-top{column-gap:var(--u40);row-gap:var(--u20);align-items:flex-end;justify-content:space-between;flex-wrap:wrap;display:flex}
.sc-copy{min-inline-size:0;flex:1 1 420px}
.sc-badge{margin-block-end:var(--u14);font-weight:600;font-size:var(--t-14);background:var(--chip-glass);border-radius:var(--rad-seg);padding-inline:var(--u12) var(--u14);block-size:34px;column-gap:var(--u9);align-items:center;display:inline-flex}
.livedot{flex:none;background:var(--on-hero);border-radius:50%;inline-size:var(--u9);block-size:var(--u9);position:relative}
.livedot::after{animation:halo 1.8s ease-out infinite;border-radius:50%;inset:0;position:absolute;content:""}
@keyframes halo{from{box-shadow:0 0 0 0 rgb(255 255 255/.7)}to{box-shadow:0 0 0 var(--u8) rgb(255 255 255/0)}}
.sc-mark{flex:none;justify-content:center;align-items:center;display:inline-flex;color:var(--tone);background:var(--on-hero);border-radius:50%;inline-size:var(--u22);block-size:var(--u22)}
.sc-mark .ico{inline-size:13px;block-size:13px}
.statecard h2{text-wrap:balance;max-inline-size:32ch;letter-spacing:-.4px;font:700 var(--t-32,32px)/1.15 var(--face-head)}
.sc-lead{font-weight:500;margin-block-start:var(--u12);max-inline-size:64ch;line-height:1.5;font-size:var(--t-16)}
.sc-lead b{font-weight:600}
.sc-call{margin-block-start:var(--u18);font-weight:600;font-size:var(--t-16);color:var(--tone);background:var(--on-hero);border-radius:var(--rad-row);padding-block:var(--u8);padding-inline:var(--u18);min-block-size:44px;column-gap:var(--u10);align-items:center;display:inline-flex}
.st-wait .sc-call{color:#B54708}
.sc-call .ico{inline-size:var(--u16);block-size:var(--u16)}
.sc-num{text-align:end}
.sc-val{white-space:nowrap;font-variant-numeric:tabular-nums;font:700 56px/.95 var(--face-head)}
.sc-val small{margin-inline-start:var(--u6);font:600 var(--t-24)/1 var(--face-head)}
.sc-cap{margin-block-start:var(--u10);font-size:var(--t-14)}
.sc-idle{margin-block-start:var(--u4);font-weight:600;font-size:var(--t-14)}
.phases{padding:0;margin:0;list-style:none;gap:var(--u6);grid-template-columns:repeat(8,minmax(0,1fr));display:grid}
.ph-bar{position:relative;overflow:hidden;background:var(--track-glass);border-radius:var(--rad-pill);block-size:var(--u10)}
.ph-bar>i{border-radius:inherit;background-color:var(--on-hero);inset-block:0;inset-inline-start:0;position:absolute}
.ph-bar>i.ph-moving{--sw:color-mix(in srgb,var(--tone) 22%,transparent);animation:drift 1.1s linear infinite;background-size:var(--u20) var(--u20);background-image:linear-gradient(-45deg,transparent 25%,var(--sw) 25% 50%,transparent 50% 75%,var(--sw) 75%)}
@keyframes drift{from{background-position-x:0}to{background-position-x:var(--u20)}}
.ph-bar.ph-skip{background:repeating-linear-gradient(135deg,var(--track-glass) 0 var(--u4),transparent var(--u4) var(--u8))}
.ph-name{white-space:nowrap;text-overflow:ellipsis;overflow:hidden;margin-block-start:var(--u10);font-weight:600;font-size:var(--t-14)}
.ph-time{font-weight:500;font-size:var(--t-14)}
.phases>.ph-dim>.ph-name,.phases>.ph-dim>.ph-time{font-weight:500;opacity:.7}
.phases>.cur>.ph-name{font-weight:700}

/* ---------- panels ---------- */
.panel{min-inline-size:0;box-shadow:var(--sh);border-radius:var(--rad-card);padding:var(--u24);background:var(--card)}
.p-head{margin-block-end:var(--u18);column-gap:var(--u16);row-gap:var(--u8);justify-content:space-between;align-items:center;flex-wrap:wrap;display:flex}
.p-head h3{align-items:center;display:inline-flex;color:var(--tx);letter-spacing:-.2px;font:700 var(--t-24)/28px var(--face-head)}
.p-aside{color:var(--mut);font-weight:600;font-size:var(--t-14)}
.is-old{font-weight:600;color:var(--ask-tx)}
.split{align-items:start;gap:var(--u24);grid-template-columns:2fr 1fr;display:grid}
.split-col{min-inline-size:0;row-gap:var(--u24);flex-direction:column;display:flex}
.cell{min-block-size:45px;padding-block:var(--u12);padding-inline:var(--u16);border-radius:var(--rad-row);background:var(--inset)}
.cells{row-gap:var(--u8);flex-direction:column;display:flex}
.faint{font-weight:500;font-size:var(--t-14);color:var(--mut)}
.morebtn{margin-block-start:var(--u12);font-weight:600;font-size:var(--t-14);color:var(--hero);background:var(--hero-soft);border-radius:var(--rad-seg);padding-inline:var(--u16);block-size:var(--u40);column-gap:var(--u6);align-items:center;display:inline-flex}
.qmark{border-radius:50%;cursor:help;color:var(--quiet);margin-inline-start:var(--u6);display:inline-flex}
.qmark:is(:hover,:focus-visible){color:var(--hero-tx)}
.bubble{transition:opacity .15s;opacity:0;max-inline-size:min(300px,80vw);inline-size:max-content;color:var(--mut);font:600 var(--t-14)/19px var(--face);padding-block:var(--u12);padding-inline:var(--u16);border-radius:var(--rad-row);box-shadow:var(--sh);background:var(--card);pointer-events:none;z-index:60;position:fixed}
.bubble.on{opacity:1}

/* ---------- stat tiles ---------- */
.stats{gap:var(--u24);grid-template-columns:repeat(4,minmax(0,1fr));display:grid}
.stat{padding-block:var(--u22);padding-inline:var(--u24);row-gap:var(--u12);flex-direction:column;display:flex}
.stat-head{column-gap:var(--u12);justify-content:space-between;align-items:flex-start;display:flex}
.stat-title{min-inline-size:0;color:var(--tx);letter-spacing:-.2px;font:700 var(--t-24)/28px var(--face-head)}
.stat-ico{display:inline-flex;flex:none;justify-content:center;align-items:center;color:var(--num);background:var(--num-soft);border-radius:50%;inline-size:72px;block-size:72px}
.stat-ico .ico{inline-size:36px;block-size:36px}
.figure{font-variant-numeric:tabular-nums;color:var(--num);font:700 48px/54px var(--face-head)}
.figure-of{color:var(--quiet);font:600 var(--t-24)/1 var(--face-head)}
.figure.is-empty{color:var(--quiet)}
.figure-word{font-size:.6em}
.stat-note{color:var(--mut);font-weight:600;font-size:var(--t-14)}
.meter{column-gap:var(--u2);display:flex;overflow:hidden;background:var(--inset);border-radius:var(--rad-pill);block-size:var(--u10)}
.meter>i{block-size:100%;display:block}
.tkdots{gap:var(--u5);flex-wrap:wrap;display:flex}
.tkdots>i{background:var(--k);border-radius:var(--u6);block-size:var(--u18);inline-size:var(--u18);display:block}
.tkdots>i.k-wait{border:1.5px dashed var(--idle)}
.tkdots>i.k-now{background-size:var(--u10) var(--u10);background-image:linear-gradient(-45deg,transparent 25%,var(--white-stripe) 25% 50%,transparent 50% 75%,var(--white-stripe) 75%);background-color:var(--now)}
.okpill{align-self:flex-start;font-weight:600;font-size:var(--t-14);border-radius:var(--rad-chip);padding-inline:var(--u10);block-size:28px;column-gap:var(--u6);align-items:center;display:inline-flex}
.okpill .ico{inline-size:var(--u14);block-size:var(--u14)}
.okpill-good{color:var(--done-tx);background:var(--done-soft)}
.okpill-bad{color:var(--bad-tx);background:var(--bad-soft)}

/* ---------- ticket kinds ---------- */
.k-done{--k:var(--done);--ks:var(--done-soft);--kt:var(--done-tx)}
.k-now{--k:var(--now);--ks:var(--now-soft);--kt:var(--now-tx)}
.k-rev{--k:var(--rev);--ks:var(--rev-soft);--kt:var(--rev-tx)}
.k-fix{--k:var(--fix);--ks:var(--fix-soft);--kt:var(--fix-tx)}
.k-bad{--k:var(--bad);--ks:var(--bad-soft);--kt:var(--bad-tx)}
.k-wait{--k:transparent;--ks:var(--inset);--kt:var(--mut)}
.hatchmove{animation:drift 1.1s linear infinite;background-size:var(--u20) var(--u20);background-image:linear-gradient(-45deg,transparent 25%,var(--blue-stripe) 25% 50%,transparent 50% 75%,var(--blue-stripe) 75%)}

/* ---------- build progress ---------- */
.kinds{gap:var(--u6);flex-wrap:wrap;display:flex}
.kind-chip{color:var(--mut);font-weight:600;font-size:var(--t-14);background:var(--inset);border-radius:var(--rad-seg);padding-inline:var(--u12);block-size:var(--u32);column-gap:var(--u7);align-items:center;display:inline-flex}
.kind-chip>i{background:var(--k);border-radius:50%;inline-size:var(--u10);block-size:var(--u10)}
.kind-chip>i.k-wait{border:1.5px dashed var(--idle)}
.kind-chip>b{font-weight:700;color:var(--tx)}
.wave-h{gap:var(--u4) var(--u10);align-items:baseline;flex-wrap:wrap;display:flex;margin-block:var(--u20) var(--u10);color:var(--tx);font:600 var(--t-16)/1.3 var(--face-head)}
.wave-h:first-child{margin-block-start:var(--u4)}
.wave-h>span{color:var(--mut);font:500 var(--t-14)/1.3 var(--face)}
.tline{margin-block-end:var(--u8);align-items:center;column-gap:var(--u12);row-gap:var(--u4);grid-template-columns:32px minmax(0,1fr) 64px;display:grid}
.tline-id{font-variant-numeric:tabular-nums;color:var(--quiet);font-weight:600;font-size:var(--t-14)}
.tline.is-live .tline-id{color:var(--tx)}
.tline.is-live .tline-time{color:var(--kt)}
.tline-bar{transition:filter .15s,transform .15s;min-inline-size:0;cursor:pointer;font-weight:600;font-size:var(--t-14);line-height:1.3;color:var(--kt);background-color:var(--ks);padding-block:var(--u6);padding-inline:var(--u16) var(--u6);border-radius:var(--rad-row);min-block-size:44px;column-gap:var(--u10);align-items:center;display:flex}
.tline-bar>span:first-child{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;min-inline-size:0;flex:1 1 auto}
.tline-tag{white-space:nowrap;flex:0 1 auto;min-inline-size:0;max-inline-size:45%;overflow:hidden;font-weight:600;font-size:var(--t-14);color:var(--kt);background:var(--card);border-radius:var(--rad-seg);padding-inline:var(--u10);block-size:var(--u32);column-gap:var(--u6);align-items:center;display:inline-flex}
.tline-tag>span{overflow:hidden;text-overflow:ellipsis}
.tline-tag .ico{inline-size:var(--u14);block-size:var(--u14)}
.tline-time{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--mut);font-weight:600;font-size:var(--t-14);text-align:end}
.tline-note{color:var(--kt);font-weight:500;font-size:var(--t-14);align-items:flex-start;column-gap:var(--u8);display:flex;grid-column:2 / span 2}
.tline-note .ico{margin-block-start:var(--u2);inline-size:var(--u16);block-size:var(--u16)}
.nothing{color:var(--tx2);font-weight:600;font-size:var(--t-16);padding-block:var(--u16);padding-inline:var(--u18);border-radius:var(--rad-row);background:var(--inset);column-gap:var(--u12);align-items:center;display:flex}
.nothing .ico{color:var(--num);inline-size:var(--u16);block-size:var(--u16)}
[role=button]{cursor:pointer}
:is(.tline-bar,.wreq,.sh-line.is-link):hover{filter:brightness(.97)}
:is(.tline-bar,.wreq,.sh-line.is-link):active{transform:scale(.995)}

/* ---------- your words ---------- */
.filters{margin-block-end:var(--u12);max-inline-size:100%;inline-size:fit-content;background:var(--inset);border-radius:var(--rad-row);padding:var(--u4);gap:var(--u2);flex-wrap:wrap;display:flex}
.filters>button{transition:color .2s,background-color .2s,box-shadow .2s;color:var(--mut);font-weight:600;font-size:var(--t-14);white-space:nowrap;border-radius:var(--rad-seg);padding-inline:var(--u10);block-size:36px;column-gap:var(--u5);align-items:center;display:inline-flex}
.filters>button>i{flex:none;border-radius:50%;inline-size:var(--u8);block-size:var(--u8)}
.filters>button>em{color:var(--quiet);font-style:normal}
.filters>button[aria-pressed=true]>em{color:var(--mut)}
.sw-done{background:var(--done)}
.sw-work{background:var(--idle)}
.sw-ph{background:var(--ask)}
.sw-quiet{background:var(--quiet)}
.wreq{transition:filter .15s,transform .15s;align-items:center;gap:var(--u8) var(--u12);grid-template-columns:minmax(0,1fr) auto;display:grid}
.wreq-body{min-inline-size:0;flex-wrap:wrap;display:flex}
.idtag{padding-block-start:var(--u2);display:inline-block;min-inline-size:var(--u40);color:var(--quiet);font-weight:600;font-size:var(--t-14)}
.wreq-quote{min-inline-size:0;flex:1;font-weight:600;font-size:var(--t-16)}
.wreq-why{margin-block-start:var(--u2);padding-inline-start:var(--u40);color:var(--mut);font-weight:500;font-size:var(--t-14);flex-basis:100%}
.stamp{white-space:nowrap;color:var(--mut);background:var(--card);font-weight:600;font-size:var(--t-14);border-radius:var(--rad-chip);padding-inline:var(--u10);block-size:28px;column-gap:var(--u6);align-items:center;display:inline-flex}
.stamp.stamp-done{color:var(--done-tx);background:var(--done-soft)}
.stamp.stamp-ask{color:var(--ask-tx);background:var(--ask-soft)}
.stamp.stamp-kind{color:var(--kt);background:var(--ks)}

/* ---------- checks, feed, groups ---------- */
.gline,.evrow{column-gap:var(--u10);grid-template-columns:var(--u16) minmax(0,1fr) auto;display:grid}
.gline{align-items:start}
.gline>.ico{margin-block-start:var(--u2);inline-size:var(--u16);block-size:var(--u16)}
.gline-t{font-weight:600;font-size:var(--t-16)}
.gline-s{margin-block-start:var(--u2);color:var(--mut);font-weight:500;font-size:var(--t-14)}
.gline-id{color:var(--quiet);font-weight:600;font-size:var(--t-14)}
.tone-ok{color:var(--done)}
.gline>.tone-ok,.evrow>.tone-ok,.evrow>.tone-quiet{color:var(--num)}
.tone-ask{color:var(--ask)}
.tone-bad{color:var(--bad)}
.tone-rev{color:var(--rev)}
.tone-fix{color:var(--fix)}
.tone-quiet{color:var(--quiet)}
.evrow{align-items:center;padding-block:var(--u8);padding-inline:var(--u16);border-radius:var(--rad-row);background:var(--inset)}
.evrow>.ico{inline-size:var(--u16);block-size:var(--u16)}
.evrow-t{font-weight:600;font-size:var(--t-14)}
.evrow-age{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--quiet);font-weight:600;font-size:var(--t-14)}
.group{padding-block:var(--u16);padding-inline:var(--u18);border-radius:var(--rad-row);background:var(--inset)}
.group+.group{margin-block-start:var(--u8)}
.group-h{font-weight:600;font-size:var(--t-16);margin-block-end:var(--u10);column-gap:var(--u8);align-items:baseline;display:flex}
.group-h>em{color:var(--num);font:700 var(--t-16)/1 var(--face-head);font-style:normal}
.codes{gap:var(--u6);flex-wrap:wrap;display:flex}
.codes>code{color:var(--tx2);background:var(--card);border-radius:var(--rad-chip);padding-block:var(--u5);padding-inline:var(--u10);font-size:var(--t-14)}
.dotlist{font-weight:500;color:var(--tx2);font-size:var(--t-14);row-gap:var(--u7);flex-direction:column;display:flex;padding:0;margin:0;list-style:none}
.dotlist>li{padding-inline-start:var(--u14);position:relative}
.dotlist>li::before{background:var(--num);border-radius:50%;block-size:var(--u5);inline-size:var(--u5);inset-block-start:.6em;inset-inline-start:0;position:absolute;content:""}
.where{color:var(--mut);font-size:.9em;font-family:var(--face-code)}
.listing .dotlist{row-gap:var(--u8)}
.listing .dotlist>li{color:var(--tx);font-size:var(--t-14);padding-block:var(--u12);padding-inline:var(--u16);border-radius:var(--rad-row);background:var(--inset)}
.listing .dotlist>li::before{content:none}
.panel-note{margin-block:calc(-1 * var(--u6)) var(--u12);color:var(--mut);font-weight:500;font-size:var(--t-14)}
.runprep{box-shadow:var(--sh),0 0 0 var(--u2) var(--ask)}
.flagdot{flex:none;margin-inline-end:var(--u10);justify-content:center;align-items:center;display:inline-flex;color:var(--ask);background:var(--ask-soft);border-radius:50%;inline-size:var(--u32);block-size:var(--u32)}
.blind-head{margin-block-end:var(--u14);align-items:center;gap:var(--u12) var(--u20);flex-wrap:wrap;display:flex}
.blind-head>.figure{flex:none}
.blind-head>p{color:var(--mut);font-weight:500;font-size:var(--t-14);flex:1 1 200px}
.missrow{font-weight:500;font-size:var(--t-14);column-gap:var(--u10);display:flex}
.missrow>.idtag{min-inline-size:auto}
.pagefoot{font-weight:500;color:var(--mut);font-size:var(--t-14);gap:var(--u8) var(--u20);justify-content:space-between;flex-wrap:wrap;display:flex}
.pagefoot code{font-size:.95em}

/* ---------- detail sheet ---------- */
.sheet{transition:visibility 0s 225ms;visibility:hidden;z-index:50;inset:0;position:fixed}
.sheet.open{transition-delay:0s;visibility:visible}
.sheet-veil{transition:opacity 225ms var(--ease-sheet);opacity:0;background:rgb(0 0 0/.3);inset:0;position:absolute}
.sheet.open .sheet-veil{opacity:1}
.sheet-pane{outline:none;box-shadow:var(--sh);transition:transform 225ms var(--ease-sheet);transform:translateX(100%);overscroll-behavior:contain;overflow-y:auto;padding-block:64px;padding-inline:var(--u26);border-start-start-radius:var(--rad-sheet);border-end-start-radius:var(--rad-sheet);background:var(--card);inline-size:min(460px,100vw);inset-block:0;inset-inline-end:0;position:absolute}
.sheet.open .sheet-pane{transform:none}
.sheet-top{margin-block-end:var(--u18);column-gap:var(--u14);align-items:center;display:flex}
.sheet-nav{flex:none;justify-content:center;align-items:center;display:inline-flex;color:var(--quiet);background:var(--inset);border-radius:50%;inline-size:48px;block-size:48px}
.sheet-nav .ico{inline-size:var(--u20);block-size:var(--u20)}
.sheet-top h2{color:var(--tx);font:700 var(--t-24)/28px var(--face-head)}
.sh-pills{margin-block-end:var(--u14);gap:var(--u6);flex-wrap:wrap;display:flex}
.sh-lede{margin-block-end:var(--u6);color:var(--mut);font-weight:600;font-size:var(--t-16)}
.sh-part{margin-block-start:var(--u20)}
.sh-part h4{color:var(--mut);font-weight:600;font-size:var(--t-16);margin:0 0 var(--u8)}
.sh-line{transition:filter .15s,transform .15s;font-weight:600;font-size:var(--t-16);min-block-size:45px;padding-block:var(--u12);padding-inline:var(--u16);border-radius:var(--rad-row);background:var(--inset);column-gap:var(--u12);justify-content:space-between;align-items:center;display:flex}
.sh-line>span:first-child{min-inline-size:0}
.sh-line>span:last-child{font-size:var(--t-14);flex:none;color:var(--mut)}
.sh-line .idtag{margin-inline-end:var(--u8);min-inline-size:auto}

/* ---------- loading ---------- */
.ghost{row-gap:var(--u24);flex-direction:column;display:flex}
.ghost i{animation:breathe 1.4s ease-in-out infinite;border-radius:var(--rad-card);background:var(--inset);display:block}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.45}}

/* ---------- first paint ---------- */
.intro>*{animation:arrive .8s var(--ease-out) both}
.intro>:nth-child(2){animation-delay:50ms}
.intro>:nth-child(n+3){animation-delay:.1s}
@keyframes arrive{0%{filter:blur(5px);transform:translateY(10px);opacity:0}100%{filter:none;transform:none;opacity:1}}

/* ---------- responsive ---------- */
@media (min-width:1181px) and (max-width:1340px){.stat-title{font-size:20px}}
@media (max-width:1180px){.stats{grid-template-columns:1fr 1fr}}
@media (max-width:1040px){.split{grid-template-columns:100%}.split>*{min-inline-size:0}}
@media (max-width:900px){
body{font-size:var(--t-14)}
.page{row-gap:var(--u12);padding:var(--u14) var(--u14) var(--u28)}
.netwarn{padding:var(--u12) var(--u14) 0}
.netwarn>div{font-size:var(--t-14)}
.masthead{row-gap:var(--u12);grid-template:"mark" auto "ctl" auto "ttl" auto / 100%}
.controls{justify-content:flex-start}
.mast-title h1{line-height:30px;font-size:var(--t-24)}
.facts{margin-block-start:var(--u10)}

var ORDER=['preflight','manifest','briefing','spec','plan','build','review','final'];
var KINDS=['done','now','rev','fix','bad','wait'];

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ic(n,c){return '<svg class="ico'+(c?' '+c:'')+'" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="'+ICONS[n]+'"/></svg>'}
function arr(x){return Array.isArray(x)?x:[]}
function num(x){return typeof x==='number'&&isFinite(x)?x:0}
function ts(s){if(!s)return null;var t=Date.parse(s);return isNaN(t)?null:t}
function p2(n){return (n<10?'0':'')+n}
function hm(d){return p2(d.getHours())+':'+p2(d.getMinutes())}
function clock(ms){if(ms==null||!isFinite(ms))return '—';var sec=Math.trunc(Math.max(ms,0)/1e3),secs=sec%60,mins=Math.trunc(sec/60)%60,hrs=Math.trunc(sec/3600);return (hrs?hrs+':'+p2(mins):String(mins))+':'+p2(secs)}

// --- preferences ---
var lang=(function(){var s=lsGet('pilot-beckie-lang');if(I18N[s])return s;var b=((navigator.language||'')+'').slice(0,2).toLowerCase();return I18N[b]?b:'en'})();
var T=I18N[lang];
var soundOn=lsGet('pilot-beckie-sound')!=='off';
var themeSet=(function(){var t=lsGet('pilot-beckie-theme');return t==='light'||t==='dark'?t:null})();
var mq=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
function effTheme(){return themeSet||(mq&&mq.matches?'dark':'light')}
function applyTheme(){var r=document.documentElement;if(themeSet)r.setAttribute('data-theme',themeSet);else r.removeAttribute('data-theme');
 var e=effTheme();document.querySelectorAll('[data-act=theme]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.v===e))})}
if(mq){var onMq=function(){if(!themeSet)applyTheme()};mq.addEventListener?mq.addEventListener('change',onMq):mq.addListener&&mq.addListener(onMq)}
applyTheme();

// --- formatting ---
function longDate(t){var d=new Date(t);if(T.date)return T.date(d);try{return d.toLocaleString(T.loc,{month:'long',day:'numeric'})+', '+hm(d)}catch(e){return d.toDateString()+' '+hm(d)}}
function sameDay(a,b){a=new Date(a);b=new Date(b);return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
function dur(min){min=Math.round(min);if(min<60)return min+' '+T.min;return Math.floor(min/60)+' '+T.hr+' '+p2(min%60)+' '+T.min}
function ofTxt(a,b){return lang==='uz'?a+'/'+b:a+' '+T.of+' '+b}
function ofSfx(b){return '<span class="figure-of">'+(lang==='uz'?'/'+b:' '+T.of+' '+b)+'</span>'}
function q(s){return lang==='en'?'“'+s+'”':'«'+s+'»'}
function agoLong(ms){var sec=Math.trunc(Math.max(ms,0)/1e3),mins=Math.trunc(sec/60);return sec<60?T.ago.s(sec):mins<60?T.ago.m(mins):T.ago.h(Math.trunc(mins/60),mins-60*Math.trunc(mins/60))}
function agoShort(ms){var mins=Math.trunc(Math.max(ms,0)/6e4);return mins<1?T.agoShort.s:mins<60?T.agoShort.m(mins):T.agoShort.h(Math.trunc(mins/60))}
function stName(id){var i=ORDER.indexOf(id);return i<0?id:T.stages[i]}
// "path:line — text" / "file.ext — text"
function located(s){s=String(s==null?'':s);var m=s.match(/^(\S+?)\s+[—–-]\s+([\s\S]+)$/);if(m&&/[\/.]|:\d/.test(m[1]))return '<span class="where">'+esc(m[1])+'</span> — '+esc(m[2]);return esc(s)}

// --- state helpers ---
var S=null;
function isT0(){return !!S&&S.tier!=null&&String(S.tier).toUpperCase()==='T0'}
function finished(){return !!(S&&S.finishedAt)}
function waiting(){return !!(S&&S.waiting&&!S.finishedAt)}
function timing(){return (S&&S.timing)||{}}
function liveExtra(now){var tm=timing();if(finished()||waiting()||!tm.lastMs)return 0;var cap=tm.capMs||2700000;return Math.min(Math.max(0,now-tm.lastMs),cap)}
function kindOf(t){return KINDS.indexOf(t&&t.kind)>=0?t.kind:'wait'}
function tickets(){return arr(S&&S.tickets).filter(function(t){return t&&typeof t==='object'})}
function stages(){return arr(S&&S.stages).filter(function(s){return s&&typeof s==='object'})}
function reqList(){return arr(S&&S.reqList).filter(function(r){return r&&typeof r==='object'})}
function rkind(r){var k=r&&r.kind;return ['done','work','open','placeholder','deferred','dropped'].indexOf(k)>=0?k:'open'}
function anyLong(){return tickets().some(function(t){var k=kindOf(t);return k==='now'||k==='rev'||k==='fix'})}
function isStale(age){if(finished()||waiting())return false;return age>(anyLong()?45:5)*60000}
function heroState(){if(finished())return 'done';if(waiting())return 'wait';if(stages().some(function(s){return s.status==='failed'}))return 'fail';return 'run'}
function curStage(){var st=stages();for(var i=0;i<st.length;i++)if(st[i].status==='active')return st[i];for(i=0;i<st.length;i++)if(st[i].status==='pending')return st[i];return st[st.length-1]||null}
function counts(){var c={done:0,now:0,rev:0,fix:0,bad:0,wait:0};tickets().forEach(function(t){c[kindOf(t)]++});return c}
function reqCounts(){var r=S.requirements,c;if(r&&typeof r==='object'&&r.total!=null)c={total:num(r.total),done:num(r.done),work:num(r.work),open:num(r.open),placeholder:num(r.placeholder),deferred:num(r.deferred),dropped:num(r.dropped)};
 else{c={total:0,done:0,work:0,open:0,placeholder:0,deferred:0,dropped:0};reqList().forEach(function(x){c.total++;c[rkind(x)]++})}
 c.live=c.total-c.dropped;return c}
// a live clock span: base ms + live part when the interval is open
// base null: an open interval ticks from its start; otherwise there is nothing to show
function lclk(base,open,start){var now=Date.now();
 if(typeof base!=='number'||!isFinite(base)){var t0=ts(start);if(!open||t0==null)return '—';var paused=finished()||waiting();return paused?clock(Math.max(0,now-t0)):'<span class="tnum" data-t="wait" data-s="'+t0+'">'+clock(now-t0)+'</span>'}
 return '<span class="tnum" data-t="clk" data-b="'+base+'" data-o="'+(open?1:0)+'">'+clock(base+(open?liveExtra(now):0))+'</span>'}

 return '<div aria-label="'+BRAND+'" role="img" class="brandmark">'+img('l',EAGLE_L)+img('d',EAGLE_D)+'<span aria-hidden="true" class="wordmark"><span class="wm-top"><b>Pilot</b><span>Lab</span></span><span class="wm-sub">'+letters+'</span></span></div>'}

 return '<div class="controls">'+h+'</div>'}

 if(S.title)h+='<h1>'+esc(S.title)+'</h1>';

 if(S.mode||S.depth)m+=tip(T.tips.mode);
 var st=ts(S.startedAt),w='';
 if(st){if(finished()){var f=ts(S.finishedAt);w=T.startedRange(longDate(st),f?hm(new Date(f)):'—')}else w=T.started(sameDay(st,Date.now())?T.today+' '+hm(new Date(st)):longDate(st))}

 if(hs==='done'){chip=T.doneState;head=S.result?esc(S.result):esc(T.doneDefault);
  var d=S.debt||{},k=arr(d.emptyEnv).length,p=arr(d.placeholders).length;sub=(k||p)?T.doneNeed(k,p):esc(T.doneNothing);
  var f=ts(S.finishedAt);num1=bigBlock('<span class="tnum">'+clock(tm.runMs)+'</span>',T.doneBig(f?hm(new Date(f)):'—'),false)}
 else if(hs==='wait'){var wk=S.waiting.kind;chip=T.waitState;head=esc(T.waitH2[wk]||T.waitState);sub=S.waiting.note?esc(S.waiting.note):'';

function concernsCard(){return listCard('con',T.concerns,S.concerns,located,T.concernsNote)}
function bootScreen(msg){return '<header class="masthead">'+logo()+'</header><section class="panel"><div class="p-head"><h3>'+esc(T.boot)+'</h3></div><p class="faint">'+esc(msg||T.bootWhy)+'</p><p class="faint" style="margin-top:8px">'+esc(T.bootHelp)+'</p></section><div class="ghost" aria-hidden="true"><div class="stats"><i style="height:150px"></i><i style="height:150px"></i><i style="height:150px"></i><i style="height:150px"></i></div><i style="height:280px"></i></div>'}

var app=document.getElementById('app'),firstPaint=true,stamp=null;
function paint(html){var y=window.scrollY;app.innerHTML=html;
 if(firstPaint){firstPaint=false;app.classList.add('intro');setTimeout(function(){app.classList.remove('intro')},1400)}
 window.scrollTo(0,y)}
function setTitle(){var parts=[];if(waiting())parts.push(T.tabWait);parts.push(S&&S.title?S.title+' — Pilot Lab':BRAND);document.title=parts.join(' — ')}
function usable(x){return x&&typeof x==='object'&&!Array.isArray(x)}
function render(){document.documentElement.lang=lang;
 if(!usable(S)){paint(bootScreen());setTitle();return}
 try{paint(page());setTitle();tick();drawerRefresh()}
 catch(err){stamp=null;paint(bootScreen(String(err&&err.message||err)))}}
function stampOf(x){return [x.rev,x.updatedAt,x.finishedAt,arr(x.tickets).length].join('|')}

// --- sound ---
// cue: [notes Hz], wave, peak gain, step s, note length s
var AC=null,CUES={
 finish:[[587,740,880,1175],'triangle',.065,.1,.4],
 done:[[698,1047],'triangle',.065,.09,.2],
 ask:[[880,1175,880],'sine',.065,.13,.24],
 fail:[[247,185],'square',.03,.15,.28],
 open:[[587,880],'sine',.055,.045,.11],
 close:[[784,523],'sine',.045,.045,.11]};
function unlock(){try{if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}if(AC&&AC.state==='suspended')AC.resume()}catch(e){}}
addEventListener('pointerdown',unlock,true);addEventListener('keydown',unlock,true);
function cue(name){if(!soundOn||!AC)return;var c=CUES[name];try{var t0=AC.currentTime+.01;c[0].forEach(function(f,i){var o=AC.createOscillator(),g=AC.createGain(),s=t0+i*c[3];o.type=c[1];o.frequency.value=f;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(c[2],s+.012);g.gain.exponentialRampToValueAtTime(.0001,s+c[4]);o.connect(g);g.connect(AC.destination);o.start(s);o.stop(s+c[4]+.02)})}catch(e){}}
var base=null;
function summary(x){var s={fin:!!x.finishedAt,wait:!!(x.waiting&&!x.finishedAt),failSt:{},bad:{},done:{}};arr(x.stages).forEach(function(st){if(st&&st.status==='failed')s.failSt[st.id]=1});arr(x.tickets).forEach(function(t){if(!t)return;var k=kindOf(t);if(k==='bad')s.bad[t.id]=1;if(k==='done')s.done[t.id]=1});return s}
function newKey(a,b){for(var k in b)if(!a[k])return true;return false}
function soundFor(next){var n=summary(next),p=base;base=n;if(!p)return;
 if(n.fin&&!p.fin)cue('finish');else if(newKey(p.failSt,n.failSt)||newKey(p.bad,n.bad))cue('fail');else if(n.wait&&!p.wait)cue('ask');else if(newKey(p.done,n.done))cue('done')}

// --- applying state ---
function apply(force){var x=window.STATE;if(!usable(x)){if(!usable(S))render();return}
 var st=stampOf(x);if(!force&&st===stamp)return;
 soundFor(x);S=x;stamp=st;render()}

// --- polling ---
var isHttp=/^https?:$/.test(location.protocol),misses=0,inflight=false,timer=null;
var lostEl=document.getElementById('netwarn');
function banner(){var show=isHttp&&misses>=2&&!finished();lostEl.hidden=!show;if(show)lostEl.firstChild.textContent=T.lost}
function schedule(){clearTimeout(timer);timer=null;if(!finished())timer=setTimeout(function(){poll(false)},POLL_MS)}
function poll(manual,cb){if(inflight){cb&&cb();return}inflight=true;clearTimeout(timer);
 var s=document.createElement('script');s.src='state.js?t='+Date.now();
 var end=function(ok){s.onload=s.onerror=null;if(s.parentNode)s.parentNode.removeChild(s);inflight=false;
  if(ok){misses=0;apply(false)}else misses=manual?Math.max(misses+1,2):misses+1;
  banner();schedule();cb&&cb()};
 s.onload=function(){end(true)};s.onerror=function(){end(false)};document.head.appendChild(s)}
// manual (button) refresh forces the banner after one miss; automatic ones need two like the poll
function refreshNow(btn){var t0=Date.now();if(btn)btn.classList.add('turning');
 poll(!!btn,function(){var b=document.querySelector('[data-act=refresh]');setTimeout(function(){b&&b.classList.remove('turning')},Math.max(0,500-(Date.now()-t0)))})}

// --- ticker ---
function tick(){var now=Date.now(),ex=liveExtra(now);
 document.querySelectorAll('[data-t]').forEach(function(el){var t=el.dataset.t;
  if(t==='clk')el.textContent=clock(+el.dataset.b+(el.dataset.o==='1'?ex:0));
  else if(t==='wait')el.textContent=clock(now-(+el.dataset.s));
  else if(t==='ago'){var a=now-(+el.dataset.s);el.textContent=(el.dataset.pre||'')+agoLong(a);if(el.dataset.stl)el.classList.toggle('is-old',isStale(a))}
  else if(t==='agoS')el.textContent=agoShort(now-(+el.dataset.s))});
 var tm=timing(),idle=!!(S&&!finished()&&!waiting()&&tm.lastMs&&now-tm.lastMs>(tm.capMs||2700000));
 document.querySelectorAll('[data-paused]').forEach(function(el){el.hidden=!idle})}
setInterval(tick,1000);

// --- drawer ---
var dw=document.getElementById('sheet'),dwP=dw.querySelector('.sheet-pane'),dwBody=dw.querySelector('.sheet-body'),dwH=document.getElementById('sheet-top'),dwBack=dw.querySelector('.sheet-nav');
var stack=[],origin=null;
function findT(id){return tickets().filter(function(t){return String(t.id)===String(id)})[0]}
function findR(id){return reqList().filter(function(r){return String(r.id)===String(id)})[0]}
function kpill(k){return '<span class="stamp stamp-kind k-'+k+'">'+ic(KIND_ICON[k])+esc(T.kinds[k])+'</span>'}
function sec(title,body){return body?'<div class="sh-part"><h4>'+esc(title)+'</h4><div class="cells">'+body+'</div></div>':''}
function drow(l,r,go){return '<div class="sh-line'+(go?' is-link':'')+'"'+(go?' role="button" tabindex="0" data-open="'+go[0]+'" data-id="'+esc(go[1])+'"':'')+'><span>'+l+'</span><span>'+r+'</span></div>'}
function ticketBody(t){var k=kindOf(t),tags=[kpill(k),'<span class="lbl">'+esc(T.dr.wave(num(t.wave)||1))+'</span>'];if(t.model)tags.push('<span class="lbl">'+esc(t.model)+'</span>');var h='<div class="sh-pills">'+tags.join('')+'</div>';
 if(t.title)h+='<p class="sh-lede">'+esc(t.title)+'</p>';
 if(t.startedAt||t.activeMs!=null)h+=sec(T.dr.time,drow(esc(T.kinds[k]),t.finishedAt||!ACTIVE[k]?(t.activeMs!=null?esc(dur(Math.max(1,Math.round(num(t.activeMs)/60000)))):'—'):lclk(t.activeMs,true,t.startedAt)));
 if(t.tests&&typeof t.tests==='object')h+=sec(T.dr.tests,drow(num(t.tests.passed)+' '+esc(T.dr.passed),num(t.tests.failed)+' '+esc(T.dr.failed)));
 h+=sec(T.dr.reqs,arr(t.reqs).map(function(id){var r=findR(id);return drow('<span class="idtag">'+esc(id)+'</span>'+(r?esc(r.text):''),r?esc(T.rs[rkind(r)]):'',r?['r',id]:null)}).join(''));
 h+=sec(T.dr.deps,arr(t.blockedBy).map(function(id){var b=findT(id);return drow('<span class="idtag">'+esc(id)+'</span>'+(b?esc(b.title||''):''),b?esc(T.chip[kindOf(b)]):'',b?['t',id]:null)}).join(''));
 if(arr(t.zone).length)h+='<div class="sh-part"><h4>'+esc(T.dr.zone)+'</h4><div class="codes">'+arr(t.zone).map(function(z){return '<code style="background:var(--inset)">'+esc(z)+'</code>'}).join('')+'</div></div>';
 if(t.review)h+=sec(T.dr.review,drow(esc(t.review),''));
 h+=sec(T.dr.findings,arr(t.repairFindings).map(function(f){return drow(esc(f),'')}).join(''));
 h+=sec(T.dr.concerns,arr(t.concerns).map(function(f){return drow(located(f),'')}).join(''));
 if(t.commit)h+=sec(T.dr.commit,drow('<code>'+esc(t.commit)+'</code>',''));
 return h}
function reqBody(r){var k=rkind(r),h='<div class="sh-pills">'+rsPill(k).replace('class="stamp"','class="stamp" style="background:var(--inset)"')+'</div><p class="sh-lede" style="color:var(--tx)">'+esc(r.text)+'</p>';
 if(r.why)h+=sec(T.dr.why,drow(esc(r.why),''));
 var tl=arr(r.tickets);h+=sec(T.dr.inTickets,tl.length?tl.map(function(id){var t=findT(id);return drow('<span class="idtag">'+esc(id)+'</span>'+(t?esc(t.title||''):''),t?esc(T.chip[kindOf(t)]):'',t?['t',id]:null)}).join(''):drow(esc(T.dr.none),''));
 return h}
function drawerDraw(keepScroll){var top=stack[stack.length-1],it=top.type==='t'?findT(top.id):findR(top.id);
 if(!it){drawerClose(true);return}
 var sc=dwP.scrollTop;dwH.textContent=top.type==='t'?T.dr.ticket(top.id):T.dr.req(top.id);
 dwBody.innerHTML=top.type==='t'?ticketBody(it):reqBody(it);
 var lb=stack.length>1?T.back:T.close;dwBack.setAttribute('aria-label',lb);dwBack.title=lb;
 dwP.scrollTop=keepScroll?sc:0;tick()}
function drawerOpen(type,id,from){var fresh=!dw.classList.contains('open');if(fresh){stack=[];origin=from?{el:from,type:type,id:id}:null}
 stack.push({type:type,id:id});drawerDraw(false);
 if(fresh){dw.classList.add('open');document.documentElement.style.overflow='hidden';dwP.focus({preventScroll:true})}cue('open')}
function drawerClose(silent){if(!dw.classList.contains('open'))return;dw.classList.remove('open');stack=[];document.documentElement.style.overflow='';
 if(!silent)cue('close');
 if(origin){var el=origin.el;if(!el||!el.isConnected)el=app.querySelector('[data-open="'+origin.type+'"][data-id="'+CSS.escape(String(origin.id))+'"]');el&&el.focus({preventScroll:true})}origin=null}
function drawerBack(){if(stack.length>1){stack.pop();drawerDraw(false);cue('close')}else drawerClose()}
function drawerRefresh(){if(dw.classList.contains('open')&&stack.length)drawerDraw(true)}

// --- tooltip ---
var tipEl=document.getElementById('bubble');
function tipShow(el){tipEl.textContent=el.dataset.tip;tipEl.classList.add('on');var r=el.getBoundingClientRect(),w=tipEl.offsetWidth,vw=document.documentElement.clientWidth;
 var x=r.left+r.width/2-w/2;x=Math.max(12,Math.min(x,vw-12-w));tipEl.style.left=x+'px';tipEl.style.top=(r.bottom+8)+'px'}
function tipHide(){tipEl.classList.remove('on')}
document.addEventListener('mouseover',function(e){var t=e.target.closest&&e.target.closest('.qmark');if(t)tipShow(t)});
document.addEventListener('mouseout',function(e){var t=e.target.closest&&e.target.closest('.qmark');if(t&&!t.contains(e.relatedTarget))tipHide()});
document.addEventListener('focusin',function(e){var t=e.target.closest&&e.target.closest('.qmark');t?tipShow(t):tipHide()});
document.addEventListener('focusout',function(e){if(e.target.closest&&e.target.closest('.qmark'))tipHide()});
addEventListener('scroll',tipHide,{passive:true});

// --- events ---
function act(el){var a=el.dataset.act,v=el.dataset.v;
 if(a==='refresh')refreshNow(el);
 else if(a==='sound'){soundOn=!soundOn;lsSet('pilot-beckie-sound',soundOn?'on':'off');var l=soundOn?T.soundOn:T.soundOff;el.setAttribute('aria-pressed',String(soundOn));el.setAttribute('aria-label',l);el.title=l;el.innerHTML=ic(soundOn?'vol':'mute');if(soundOn){unlock();cue('open')}}
 else if(a==='theme'){themeSet=v;lsSet('pilot-beckie-theme',v);applyTheme()}
 else if(a==='lang'){if(v!==lang){lang=v;T=I18N[v];lsSet('pilot-beckie-lang',v);render();banner()}}
 else if(a==='filter'){ui.filter=v;ui.expand.words=false;render()}
 else if(a==='more'){ui.expand[el.dataset.k]=!ui.expand[el.dataset.k];render()}}
document.addEventListener('click',function(e){var t=e.target;if(!t.closest)return;
 var a=t.closest('[data-act]');if(a){act(a);return}
 if(t.closest('.sheet-nav')){drawerBack();return}
 if(t.closest('.sheet-veil')){drawerClose();return}
 var o=t.closest('[data-open]');if(o)drawerOpen(o.dataset.open,o.dataset.id,dw.contains(o)?null:o)});
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'&&dw.classList.contains('open')){drawerClose();return}
 if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-open][role=button]')){e.preventDefault();var o=e.target;drawerOpen(o.dataset.open,o.dataset.id,dw.contains(o)?null:o)}});
document.addEventListener('visibilitychange',function(){if(!document.hidden){tick();if(!finished())refreshNow()}});
addEventListener('pageshow',function(e){if(e.persisted){tick();if(!finished())refreshNow()}});

// --- start ---
(function(){var x=window.STATE;if(usable(x)){S=x;stamp=stampOf(x);base=summary(x)}render();if(!finished())schedule()})();

</script>
</body>
</html>
